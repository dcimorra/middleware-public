<!doctype html>
<html lang="{{.Lang}}"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">{{if .Reload}}<meta http-equiv="refresh" content="{{.Reload}}">{{end}}
<title>{{.Title}}</title>
<style>
  :root {
    color-scheme: dark;
    --paper:#0a1930; --rule:#2c4d78; --ink:#dce8f5; --grey:#7fa0c4; --accent:#48d4ff;
    --paso:34px;
  }
  body.waiting  { --accent:#54ffcf; }
  body.paused   { --accent:#ffcf5c; }
  body.broken    { --accent:#ff6f6f; }
  body.nothing    { --accent:#7fa0c4; }
  body.locked { --accent:#48d4ff; }
  * { box-sizing:border-box; }
  html, body { margin:0; overflow-x:hidden; }
  body {
    min-height:100dvh; display:grid; place-items:center;
    padding:clamp(1.25rem, 5vw, 3rem);
    background:
      repeating-linear-gradient(0deg, var(--rule) 0 1px, transparent 1px var(--paso)),
      repeating-linear-gradient(90deg, var(--rule) 0 1px, transparent 1px var(--paso)),
      var(--paper);
    background-blend-mode:screen;
    color:var(--ink);
    font:400 15px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    -webkit-font-smoothing:antialiased;
  }
  main {
    position:relative; width:100%; max-width:42rem; padding:clamp(1.75rem, 5vw, 2.75rem);
  }
  /* Corner brackets: four little L-shapes instead of a border, the way a
     viewfinder marks the frame instead of drawing a box around it. */
  main::before, main::after, .corner-a, .corner-b { content:""; position:absolute; width:1.75rem; height:1.75rem;
    border-color:var(--accent); border-style:solid; border-width:0; }
  main::before { top:0; left:0; border-top-width:2px; border-left-width:2px; }
  main::after  { bottom:0; right:0; border-bottom-width:2px; border-right-width:2px; }
  .corner-a   { top:0; right:0; border-top-width:2px; border-right-width:2px; }
  .corner-b   { bottom:0; left:0; border-bottom-width:2px; border-left-width:2px; }

  .ref {
    position:absolute; top:-1.4rem; left:0; font-size:.6875rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--grey);
  }
  .status {
    display:inline-flex; align-items:center; gap:.5rem; margin:0 0 1.25rem;
    padding:0; color:var(--accent); font-size:.8125rem; letter-spacing:.16em;
    text-transform:uppercase;
  }
  .status::before { content:"◈"; }
  h1 {
    margin:0 0 .25rem; font-size:clamp(1.375rem, 4.5vw, 1.875rem); font-weight:600;
    letter-spacing:-.01em; line-height:1.3; font-family:ui-monospace,monospace;
  }
  .signal { height:1px; width:3.5rem; margin:1rem 0 1.25rem; background:var(--accent); }
  /* The leader line: a dashed rule down the left of the explanation, the way a
     callout on a real drawing runs from the part to its note. */
  .line {
    margin:0; padding-left:1rem; border-left:1px dashed var(--rule);
    color:var(--grey); max-width:46ch;
    font-family:ui-sans-serif,system-ui,-apple-system,sans-serif; font-size:.9375rem;
  }

  .password { display:flex; flex-wrap:wrap; gap:.5rem; margin:1.5rem 0 0 1rem; max-width:30rem; }
  .password input {
    flex:1 1 11rem; min-width:0; padding:.65rem .8rem;
    border:1px solid var(--rule); border-radius:2px;
    background:rgba(255,255,255,.03); color:var(--ink); font:inherit; font-size:.9375rem;
  }
  .password input:focus { outline:1px solid var(--accent); outline-offset:1px; }
  .password button {
    flex:none; padding:.65rem 1.1rem; border:1px solid var(--accent); border-radius:2px;
    background:transparent; color:var(--accent);
    font:inherit; font-size:.8125rem; letter-spacing:.06em; text-transform:uppercase;
    cursor:pointer; transition:background .15s ease, color .15s ease;
  }
  .password button:hover, .password button:focus-visible { background:var(--accent); color:var(--paper); }
  .password .wrong { flex-basis:100%; margin:0; font-size:.8125rem; color:var(--accent); }
  .when { margin:.9rem 0 0 1rem; color:var(--grey); font-size:.8125rem; }
  .when time { color:var(--ink); }

  .exit {
    display:inline-block; margin:1.5rem 0 0 1rem; padding:.6rem 1rem;
    border:1px solid var(--rule); border-radius:2px; text-decoration:none;
    color:var(--ink); font-size:.8125rem; letter-spacing:.05em; text-transform:uppercase;
    transition:border-color .15s ease, color .15s ease;
  }
  .exit::after { content:" →"; color:var(--grey); }
  .exit:hover, .exit:focus-visible { border-color:var(--accent); color:var(--accent); }
  :focus-visible { outline:1px solid var(--accent); outline-offset:2px; }

  footer {
    display:flex; gap:1rem; justify-content:space-between; align-items:baseline;
    margin:2rem 1rem 0 1rem; padding-top:.85rem; border-top:1px solid var(--rule);
    font-size:.6875rem; letter-spacing:.1em; text-transform:uppercase; color:var(--grey);
  }
  footer .code { color:var(--accent); }
</style>
</head><body class="{{.Signal}}">
<main>
  <span class="corner-a"></span><span class="corner-b"></span>
  <p class="ref">REF · {{.Status}} · {{.Foot}}</p>
  <p class="status">{{.Label}}</p>
  <h1>{{.Title}}</h1>
  <div class="signal" aria-hidden="true"></div>
  <p class="line">{{.Line}}</p>
  {{.Extra}}
  {{if .LinkHref}}<a class="exit" href="{{.LinkHref}}">{{.LinkText}}</a>{{end}}
  <footer><span>{{.Foot}}</span><span class="code">{{.Status}}</span></footer>
</main>
</body></html>
