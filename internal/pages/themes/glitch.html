<!doctype html>
<html lang="{{.Lang}}"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">{{if .Reload}}<meta http-equiv="refresh" content="{{.Reload}}">{{end}}
<title>{{.Title}}</title>
<style>
  :root {
    color-scheme: dark;
    --ground:#050507; --ink:#e6ffee; --grey:#7c8a86; --rule:#1c2622;
    --accent:#39ff9d; --a:#39ff9d; --b:#ff2ecb; --c:#2ecbff;
  }
  body.waiting  { --accent:#2ecbff; --a:#2ecbff; --b:#ff2ecb; }
  body.paused   { --accent:#ffd23f; --a:#ffd23f; --b:#ff2ecb; }
  body.broken    { --accent:#ff4d4d; --a:#ff4d4d; --b:#2ecbff; }
  body.nothing    { --accent:#7c8a86; --a:#7c8a86; --b:#3a4440; }
  body.locked { --accent:#39ff9d; --a:#39ff9d; --b:#ff2ecb; }
  * { box-sizing:border-box; }
  html, body { margin:0; overflow-x:hidden; }
  body {
    position:relative; min-height:100dvh; display:grid; place-items:center;
    padding:clamp(1.25rem, 5vw, 3rem);
    background:var(--ground); color:var(--ink);
    font:400 15px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    -webkit-font-smoothing:antialiased;
  }
  /* Scanlines, over everything, and thin enough to read as texture and not as
     stripes: a CRT's lines are part of the glass, not part of the picture. */
  body::after {
    content:""; position:fixed; inset:0; pointer-events:none; z-index:2;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply;
  }
  body.waiting::before {
    content:""; position:fixed; left:0; right:0; height:38%; z-index:1;
    background:linear-gradient(180deg, transparent, rgba(57,255,157,.06), transparent);
    animation:barrido 3.2s linear infinite;
  }
  @keyframes barrido { from { top:-40% } to { top:100% } }
  @media (prefers-reduced-motion:reduce) { body.waiting::before { display:none; } }

  main { position:relative; z-index:3; width:100%; max-width:38rem; }
  .status {
    display:inline-flex; align-items:center; gap:.5rem; margin:0 0 1.5rem;
    padding:.3rem .7rem; border:1px solid var(--accent); color:var(--accent);
    font-size:.75rem; letter-spacing:.14em; text-transform:uppercase;
  }
  .status::before { content:"//"; opacity:.6; }

  h1 {
    position:relative; margin:0 0 1.25rem; font-size:clamp(2rem, 7vw, 3.25rem);
    font-weight:700; line-height:1.05; letter-spacing:-.01em; text-wrap:balance;
  }
  /* The mis-registered ghost copies: same text, shifted a couple of pixels,
     tinted, laid underneath with the real title on top. Three read-outs of
     the same signal instead of one, which is the whole idea of the design. */
  h1::before, h1::after {
    content:attr(data-t); position:absolute; inset:0; z-index:-1;
  }
  h1::before { color:var(--a); transform:translate(2px,0); opacity:.7; }
  h1::after  { color:var(--b); transform:translate(-2px,0); opacity:.7; }
  @media (prefers-reduced-motion:no-preference) {
    h1::before { animation:tira 4.5s steps(1,end) infinite; }
    h1::after  { animation:tira 4.5s steps(1,end) infinite reverse; }
  }
  @keyframes tira { 0%,92% { transform:translate(2px,0) } 93%,96% { transform:translate(-3px,1px) }
                    97%,100% { transform:translate(2px,0) } }

  .signal { display:none; }
  .line { margin:0; max-width:52ch; color:var(--grey); }

  .password { display:flex; flex-wrap:wrap; gap:.5rem; margin:1.5rem 0 0; max-width:30rem; }
  .password input {
    flex:1 1 11rem; min-width:0; padding:.7rem .85rem;
    border:1px solid var(--rule); border-radius:0;
    background:#0a0d0b; color:var(--ink); font:inherit; font-size:.9375rem;
    caret-color:var(--accent);
  }
  .password input:focus { outline:1px solid var(--accent); outline-offset:1px;
                        box-shadow:0 0 0 3px color-mix(in oklab, var(--accent) 25%, transparent); }
  .password button {
    flex:none; padding:.7rem 1.1rem; border:1px solid var(--accent); border-radius:0;
    background:var(--accent); color:#050507;
    font:inherit; font-weight:700; font-size:.875rem; letter-spacing:.04em;
    text-transform:uppercase; cursor:pointer;
  }
  .password button:hover, .password button:focus-visible { filter:brightness(1.15); }
  .password .wrong { flex-basis:100%; margin:0; font-size:.8125rem; color:var(--b); }
  .when { margin:1rem 0 0; color:var(--grey); font-size:.875rem; }
  .when time { color:var(--ink); }

  .exit {
    display:inline-flex; align-items:center; gap:.5rem; margin-top:1.5rem;
    padding:.65rem 1.05rem; border:1px solid var(--rule); text-decoration:none;
    color:var(--ink); font-size:.875rem; letter-spacing:.02em;
    transition:border-color .15s ease, color .15s ease;
  }
  .exit::after { content:"→"; color:var(--accent); }
  .exit:hover, .exit:focus-visible { border-color:var(--accent); color:var(--accent); }
  :focus-visible { outline:1px solid var(--accent); outline-offset:2px; }

  footer {
    position:relative; z-index:3;
    display:flex; gap:1rem; justify-content:space-between; align-items:baseline;
    margin:2rem 0 0; padding-top:.9rem; border-top:1px solid var(--rule);
    font-size:.75rem; letter-spacing:.05em; color:var(--grey);
  }
  footer .code { color:var(--accent); }
</style>
</head><body class="{{.Signal}}">
<main>
  <p class="status">{{.Label}}</p>
  <h1 data-t="{{.Title}}">{{.Title}}</h1>
  <div class="signal" aria-hidden="true"></div>
  <p class="line">{{.Line}}</p>
  {{.Extra}}
  {{if .LinkHref}}<a class="exit" href="{{.LinkHref}}">{{.LinkText}}</a>{{end}}
  <footer><span>{{.Foot}}</span><span class="code">{{.Status}}</span></footer>
</main>
</body></html>
