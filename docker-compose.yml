# middleware in a container. Good for trying it out, for a development
# machine and for hosts without systemd. The image ships Node, Claude
# Code, the Gemini CLI and wireguard-tools, and keeps the CLIs current on
# its own. With the three "helper" lines below uncommented the privileged
# helper runs inside the container too, so the layer-3 firewall and the
# WireGuard vpn work; without them only the port reservation sysctl is
# missing. On a real server prefer `middleware install`; see
# docs/install.md.
#
#   cp .env.example .env   # or: echo "MIDDLEWARE_SECRET_KEY=$(openssl rand -hex 32)" > .env
#   docker compose up -d
#   docker compose exec middleware middleware setup
#   open http://127.0.0.1:46100

services:
  middleware:
    build:
      context: .
      args:
        VERSION: ${MIDDLEWARE_VERSION:-dev}
    image: middleware:${MIDDLEWARE_VERSION:-dev}
    restart: unless-stopped
    environment:
      MIDDLEWARE_ROOT: /srv/middleware
      # Encrypts module credentials at rest. Without it the key is generated
      # into data/modules-key inside the volume, which is fine as long as the
      # volume is backed up with it; set it here to keep the two apart.
      MIDDLEWARE_SECRET_KEY: ${MIDDLEWARE_SECRET_KEY:?set MIDDLEWARE_SECRET_KEY in .env}
      # The privileged helper inside the container (firewall, vpn). Needs
      # the capability below; both lines together or neither.
      # MIDDLEWARE_HELPER: "1"
    # cap_add:
    #   - NET_ADMIN
    # The container starts as root and hands the supervisor to the
    # unprivileged user `middleware` (a system uid), fixing the volume's
    # owner on the way. To bind-mount a host directory instead of the
    # volume below, either leave that as is and let it chown the
    # directory to that uid, or run as the directory's owner (`id -u`:
    # `id -g`), in which case there is no helper.
    # user: "1000:1000"
    volumes:
      # Everything: sites, tasks, data, modules. One volume so a backup is
      # one thing.
      - root:/srv/middleware
      # Or a host directory, with `user:` above set to its owner:
      # - /home/me/middleware-data:/srv/middleware
      # Uncomment to let the docker runtime start site containers on the
      # host's daemon. This hands the container root-equivalent access to
      # the host; only do it on a machine where that is acceptable.
      # - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # Panel and API, loopback only. Reach it through an SSH tunnel
      # (ssh -L 46100:127.0.0.1:46100 host) or put a tunnel in front.
      - "127.0.0.1:46100:46100"
      # The ports door. Commented because a fresh installation has no
      # certificates and no domains yet; enable inbound-ports in the panel
      # with the door on 8080/8443 (unprivileged inside the container), then
      # uncomment so the host's 80 and 443 reach them.
      # - "80:8080"
      # - "443:8443"
      # The local door (development bench; docs/install.md). The image
      # defaults it to 0.0.0.0:8080 and 0.0.0.0:5353; open it on the
      # Inbound screen and uncomment. Do not combine with the ports door
      # lines above.
      # - "127.0.0.1:80:8080"
      # - "127.0.0.1:5353:5353/udp"
      # - "127.0.0.1:5353:5353/tcp"
      # The vpn, when the helper lines above are on.
      # - "51820:51820/udp"
    # tini in the image reaps site processes; init: true would add a second.
    stop_grace_period: 30s

volumes:
  root:
