name: release

# A tag v* builds the two Linux binaries the install script downloads,
# writes a sha256 next to each, and publishes a GitHub release with them.
# The version inside the binary is the tag, so `middleware version` on a
# server names the release it came from.

on:
  push:
    tags: ["v*"]
  # Manual releases from the Actions tab: the workflow creates the tag
  # itself, so a release never depends on whoever is cutting it being able
  # to push tags from their machine.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release (v2.0.0-alpha.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            case "$INPUT_TAG" in v[0-9]*) ;; *) echo "tag must look like v2.0.0" >&2; exit 1 ;; esac
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # A tag whose run failed before publishing is moved to the
            # current commit; a tag that already has a release is never
            # touched, because binaries people downloaded must keep
            # matching it.
            if git rev-parse -q --verify "refs/tags/$INPUT_TAG" >/dev/null; then
              if gh release view "$INPUT_TAG" >/dev/null 2>&1; then
                echo "tag $INPUT_TAG already has a release" >&2; exit 1
              fi
              echo "tag $INPUT_TAG exists without a release: moving it to $(git rev-parse --short HEAD)"
              git tag -f -a "$INPUT_TAG" -m "$INPUT_TAG"
              git push -f origin "refs/tags/$INPUT_TAG"
            else
              git tag -a "$INPUT_TAG" -m "$INPUT_TAG"
              git push origin "refs/tags/$INPUT_TAG"
            fi
            echo "version=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.version }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: no third-party dependencies in the core
        run: test "$(go list -m all | wc -l)" = "1"
      - name: test
        run: go test -race ./...
      - name: build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          name="middleware-linux-${{ matrix.arch }}"
          go build -trimpath -ldflags "-s -w -X main.Version=${{ needs.tag.outputs.version }}" -o "dist/$name" ./cmd/middleware
          # sha256sum's own format ("<hash>  <name>"), which is what
          # scripts/install.sh parses and what `sha256sum -c` accepts.
          (cd dist && sha256sum "$name" > "$name.sha256")
          cat "dist/$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: middleware-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: list
        run: ls -l dist && cat dist/*.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.version }}
          prerelease: ${{ contains(needs.tag.outputs.version, '-') }}
          files: dist/*
          generate_release_notes: true
          body: |
            Install or update on a Linux server:

                curl -fsSL https://raw.githubusercontent.com/dcimorra/the-middleware/main/scripts/install.sh | sh

            Each binary has a `.sha256` next to it; the script verifies it before running anything.
